name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # ── Windows build ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Tesseract (Windows)
        run: choco install tesseract -y

      - name: Build backend
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller app.spec --noconfirm
          New-Item -ItemType Directory -Force -Path dist\backend\uploads\main | Out-Null

      - name: Bundle Tesseract
        shell: pwsh
        run: |
          $tessSrc = "C:\Program Files\Tesseract-OCR"
          Copy-Item -Recurse -Force $tessSrc tesseract-bundle
          # pyocr (frozen mode) looks for tessdata at <_MEIPASS>/data.
          # Mirror tessdata into the PyInstaller bundle so libtesseract finds language files.
          $tessdataSrc = Join-Path $tessSrc 'tessdata'
          $tessdataDst = 'dist\app\_internal\data'
          New-Item -ItemType Directory -Force -Path $tessdataDst | Out-Null
          Copy-Item -Recurse -Force "$tessdataSrc\*" $tessdataDst
          Write-Host "=== tessdata mirrored to $tessdataDst ==="
          Get-ChildItem $tessdataDst -Filter *.traineddata | Select-Object Name

      - name: Build Electron installer
        shell: pwsh
        run: |
          cd electron
          npm install
          npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $outputDir = "dist\electron"
          $canonical = Join-Path $outputDir "NutriProof-Setup.exe"
          $found = Get-ChildItem $outputDir -Filter "*Setup*.exe" -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $found) { throw "No Setup installer found in $outputDir" }
          if ($found.Name -ne "NutriProof-Setup.exe") {
            Move-Item $found.FullName $canonical -Force
          }
          Get-ChildItem $outputDir -Filter "*Setup*.exe" -File |
            Where-Object { $_.Name -ne "NutriProof-Setup.exe" } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Sign Windows installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          files-folder: dist/electron
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com/
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName verify /pa /v "dist\electron\NutriProof-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NutriProof-Windows
          path: |
            dist/electron/NutriProof-Setup.exe
            dist/electron/latest.yml

  # ── macOS build ────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Tesseract (macOS)
        run: brew install tesseract

      - name: Build backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller app.spec --noconfirm
          mkdir -p dist/backend/uploads/main

      - name: Bundle Tesseract
        run: |
          set -e
          TESSERACT_DEST="tesseract-bundle"
          rm -rf "$TESSERACT_DEST"
          if [ -d "/opt/homebrew/opt/tesseract" ]; then
            TESSERACT_PREFIX="/opt/homebrew/opt/tesseract"
            TESSDATA_DIR="/opt/homebrew/share/tessdata"
            BREW_LIB="/opt/homebrew/lib"
          else
            TESSERACT_PREFIX="/usr/local/opt/tesseract"
            TESSDATA_DIR="/usr/local/share/tessdata"
            BREW_LIB="/usr/local/lib"
          fi
          mkdir -p "$TESSERACT_DEST/bin" "$TESSERACT_DEST/lib" "$TESSERACT_DEST/share/tessdata"

          # Copy tesseract binary
          cp "$TESSERACT_PREFIX/bin/tesseract" "$TESSERACT_DEST/bin/"
          chmod +w "$TESSERACT_DEST/bin/tesseract"

          # Recursively gather all Homebrew dylib dependencies
          # Walks otool -L output, copying each non-system dylib into bundle/lib.
          # Resolves @rpath/<name> references by searching known Homebrew lib paths.
          BREW_SEARCH_PATHS=(
            "/opt/homebrew/lib"
            "/usr/local/lib"
            "/opt/homebrew/opt/leptonica/lib"
            "/opt/homebrew/opt/webp/lib"
            "/opt/homebrew/opt/libpng/lib"
            "/opt/homebrew/opt/jpeg-turbo/lib"
            "/opt/homebrew/opt/libtiff/lib"
            "/opt/homebrew/opt/openjpeg/lib"
            "/opt/homebrew/opt/giflib/lib"
            "/opt/homebrew/opt/xz/lib"
          )
          # Also append every brew --prefix */lib for any installed formula
          while IFS= read -r p; do
            [ -d "$p/lib" ] && BREW_SEARCH_PATHS+=("$p/lib")
          done < <(brew list --formula 2>/dev/null | xargs -n1 brew --prefix 2>/dev/null || true)

          resolve_dep() {
            local dep="$1"
            case "$dep" in
              /*)
                [ -f "$dep" ] && echo "$dep" && return 0
                ;;
              @rpath/*|@loader_path/*|@executable_path/*)
                local name="${dep##*/}"
                for p in "${BREW_SEARCH_PATHS[@]}"; do
                  if [ -f "$p/$name" ]; then
                    echo "$p/$name"
                    return 0
                  fi
                done
                ;;
            esac
            return 1
          }

          gather_deps() {
            local target="$1"
            local seen_file="$2"
            otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              # Skip system libraries
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
              esac
              [ -z "$dep" ] && continue
              local resolved
              resolved=$(resolve_dep "$dep") || continue
              local base
              base=$(basename "$resolved")
              # Skip if it's the target itself (LC_ID_DYLIB self-reference)
              if [ "$(basename "$target")" = "$base" ]; then continue; fi
              local out="$TESSERACT_DEST/lib/$base"
              if ! grep -qx "$base" "$seen_file"; then
                echo "$base" >> "$seen_file"
                echo "  + $resolved -> lib/$base"
                cp -L "$resolved" "$out"
                chmod +w "$out"
                gather_deps "$out" "$seen_file"
              fi
            done
          }

          SEEN_FILE=$(mktemp)
          echo "Gathering dependencies for tesseract..."
          gather_deps "$TESSERACT_DEST/bin/tesseract" "$SEEN_FILE"
          rm -f "$SEEN_FILE"

          # Rewrite install names: every non-system dylib reference becomes @rpath/<basename>
          rewrite_install_names() {
            local target="$1"
            if [[ "$target" == *.dylib ]]; then
              local base
              base=$(basename "$target")
              install_name_tool -id "@rpath/$base" "$target" 2>/dev/null || true
            fi
            otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
              esac
              [ -z "$dep" ] && continue
              local base
              base=$(basename "$dep")
              # Skip self-reference
              if [ "$(basename "$target")" = "$base" ] && [[ "$dep" == @rpath/* ]]; then continue; fi
              install_name_tool -change "$dep" "@rpath/$base" "$target" 2>/dev/null || true
            done
          }

          echo "Rewriting install names..."
          rewrite_install_names "$TESSERACT_DEST/bin/tesseract"
          # Add rpath so executable finds dylibs in ../lib (relative to bin/)
          install_name_tool -add_rpath "@executable_path/../lib" "$TESSERACT_DEST/bin/tesseract" 2>/dev/null || true

          for lib in "$TESSERACT_DEST/lib"/*.dylib; do
            [ -f "$lib" ] || continue
            rewrite_install_names "$lib"
            # Add rpath so dylibs find their siblings in the same directory
            install_name_tool -add_rpath "@loader_path" "$lib" 2>/dev/null || true
          done

          # Copy tessdata
          if [ -d "$TESSDATA_DIR" ]; then
            cp "$TESSDATA_DIR"/*.traineddata "$TESSERACT_DEST/share/tessdata/" 2>/dev/null || true
          fi

          echo "=== Bundle contents ==="
          ls -la "$TESSERACT_DEST/bin/"
          ls -la "$TESSERACT_DEST/lib/" | head -50
          echo "=== Final tesseract dependencies ==="
          otool -L "$TESSERACT_DEST/bin/tesseract"

          # Smoke test: run bundled tesseract from a clean PATH
          echo "=== Smoke test ==="
          DYLD_PRINT_LIBRARIES=0 "$TESSERACT_DEST/bin/tesseract" --version || {
            echo "::error::Bundled tesseract failed to run"
            exit 1
          }

          # pyocr (frozen mode) overrides TESSDATA_PREFIX with <_MEIPASS>/data.
          # Mirror tessdata into the PyInstaller bundle so libtesseract finds language files.
          PYI_DATA_DIR="dist/app/_internal/data"
          mkdir -p "$PYI_DATA_DIR"
          if [ -d "$TESSDATA_DIR" ]; then
            cp "$TESSDATA_DIR"/*.traineddata "$PYI_DATA_DIR/" 2>/dev/null || true
          fi
          echo "=== tessdata mirrored to $PYI_DATA_DIR ==="
          ls -la "$PYI_DATA_DIR"

      - name: Build Electron installer (macOS)
        run: |
          cd electron
          npm install
          # Unset empty signing vars to prevent electron-builder from treating them as file paths
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize macOS app (Gatekeeper)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Skipping notarization: missing Apple ID credentials"
            exit 0
          fi

          DMG_PATH=$(ls -1 dist/electron/*.dmg 2>/dev/null | head -n1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found to notarize"
            exit 1
          fi

          echo "Notarizing: $DMG_PATH"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait 2>&1)
          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -E '^[[:space:]]*id:' | head -n1 | awk '{print $2}')
          STATUS=$(echo "$SUBMIT_OUTPUT" | grep -E 'status:' | tail -n1 | awk '{print $2}')

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "=== Fetching notarization log for $SUBMISSION_ID ==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            fi
            exit 1
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"
          echo "Notarization complete!"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: NutriProof-macOS
          path: |
            dist/electron/*.dmg
            dist/electron/latest-mac.yml

  # ── Publish to GitHub Releases (only on tags) ─────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NutriProof-Windows/*.exe
            artifacts/NutriProof-Windows/latest.yml
            artifacts/NutriProof-macOS/*.dmg
            artifacts/NutriProof-macOS/latest-mac.yml
          generate_release_notes: true
